name: deploy-site-arc

# Publishes the arc agent repo landing page (site-arc/) to
# arc-gasp.arclumen.de via Cloudflare Workers/Assets.
# Cloudflare creds are pulled at runtime from Bitwarden Secrets Manager (BWS)
# via bitwarden/sm-action. Required GitHub setup (repo Settings):
#   - Secret   BWS_ACCESS_TOKEN           : a BWS service-account access token (NOT a UUID)
#   - Variable SM_CLOUDFLARE_API_TOKEN    : the BWS UUID of the CF API-token secret
#   - Variable SM_CLOUDFLARE_ACCOUNT_ID   : the BWS UUID of the CF Account-ID secret
# The VARs hold UUIDs (pointers); the real secret VALUES stay in BWS. sm-action
# resolves them to the actual creds and exports them as CLOUDFLARE_* env vars.
# Only runs when the arc landing-page source actually changes.
#
# NOTE: arc-gasp.arclumen.de is a custom domain for the PRIVATE arc-gasp agent
# repo. The page is a read-only "fold the log" view; it must not expose secrets.

on:
  push:
    branches: [main]
    paths:
      - "site-arc/**"
      - ".github/workflows/deploy-site-arc.yml"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-arc
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --- Pull Cloudflare creds from Bitwarden Secrets Manager (BWS) ---
      # UUIDs live in GitHub *variables* (vars.SM_*); the actual secret values
      # are resolved at runtime and exported as the CLOUDFLARE_* env vars.
      - name: Pull secrets from Bitwarden
        id: bws
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu
          secrets: |
            ${{ vars.SM_CLOUDFLARE_API_TOKEN }} > CLOUDFLARE_API_TOKEN
            ${{ vars.SM_CLOUDFLARE_ACCOUNT_ID }} > CLOUDFLARE_ACCOUNT_ID

      # Pinned (not `@latest`) for deterministic, reproducible deploys.
      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4.118.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
