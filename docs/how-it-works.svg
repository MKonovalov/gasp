  <text x="894.0" y="492" font-size="11.5" fill="#1d4ed8" text-anchor="middle" class="m">laptop</text>
  <rect x="940" y="475" width="40" height="26" rx="13" fill="#ffffff" stroke="#93c5fd"/>
  <text x="960.0" y="492" font-size="11.5" fill="#1d4ed8" text-anchor="middle" class="m">CI</text>
  <rect x="992" y="475" width="103" height="26" rx="13" fill="#ffffff" stroke="#93c5fd"/>
  <text x="1043.5" y="492" font-size="11.5" fill="#1d4ed8" text-anchor="middle" class="m">any harness</text>
